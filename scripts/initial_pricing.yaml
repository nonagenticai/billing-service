      that can price it. Provider was unseeded until 2026-09-04 — every event
      carried cost_usd=NULL and generate_billing() skipped it. ⚠️ The emitter also
      sends an EMPTY served_model (rendered as model="unknown" on
      billing_pricing_miss_total), so this row is reached by rung 4
      (provider, NULL, NULL) and a priced "unknown" bucket is a PERMANENT blind
      spot: once this row exists, a genuinely new kag unit prices off it silently
