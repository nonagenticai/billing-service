# Initial provider_pricing seed data.
#
# WHEN PRICES CHANGE, DO NOT EDIT THIS FILE.
#
# This YAML is the *seed-from-empty* starting point — what gets loaded into a
# brand-new metering deployment that has no provider_pricing rows yet. Once
# rows exist, the running source-of-truth is the database (provider_pricing
# table + audit_log), not this file.
#
# To record a rate change for an already-seeded (provider, model):
#   POST /api/config/provider-pricing
# (manually with curl, via the admin UI, or by a service-account script).
# Each POST closes the prior row's effective_until and inserts a new
# open-ended row, with an audit_log entry capturing actor + before/after.
#
# Editing this file after the initial seed will silently diverge from the DB.
# The seed script flags such divergence and exits non-zero rather than
# auto-correcting.
#
# All rates are USD per 1,000,000 tokens (per_token cost_model) unless
# otherwise noted. Rates are quoted as strings to preserve Decimal precision
# through YAML parsing — float would lose trailing zeros and risk binary
# rounding.

version: 1
effective_from: "2026-04-26T00:00:00Z"

# --- EMITTER <-> PRICING CONTRACT -------------------------------------------
# Every string a producer can put in cost_events.provider MUST appear as a
# `provider` in `rows` below, AND (enforced by tests/test_pricing_coverage.py)
# must have a provider-default row (model: null, service_key: null) so that an
# unseeded model id resolves on rung 4 of services/pricing.py
# `_resolve_pricing_row` instead of leaving cost_usd NULL.
#
# WHY THIS LIST EXISTS: a pricing miss does not raise. It writes NULL into
# billing_cost_events.cost_usd, the rollups COALESCE it to 0, and the money
# leaves the system silently. 17,626 such events existed in prod on 2026-07-19.
# This list turns "we forgot a provider" from a silent revenue leak into a
# failing test.
#
# DERIVED FROM (re-derive, do not trust this comment blindly):
#   * worker_management/src/worker/agents/pydantic_ai_agent.py — the
#     `ModelProvider` Literal (the BYO adapter names).
#   * worker_management/src/worker/agents/provider_catalog.py — the catalog
#     preset `provider` values and `_BILLING_PROVIDER_OVERRIDES`
#     (`billing_provider_for` returns the override, else the preset provider).
#   * gitops-production clusters/strato/services/inference-router/
#     providers-configmap.yaml — the router provider `name:`s (e.g. `claude`,
#     `pgx-local`) and the `model_aliases` tier map.
#   * The self-hosted / modality / KAG emitters already seeded below.
#
# The list is duplicated here ON PURPOSE — billing-service does not import from
# worker_management. One service, one contract; a cross-repo import would make
# the pricing seed undeployable without the worker repo.
#
# NOT ON THIS LIST, AND WHY: `mlx`, `vlm_local` are `ModelProvider` adapter
# names but have never been observed as cost_events.provider strings — the
# self-hosted emitters send `gemma` (vLLM) and `mlx_inference` instead. If one
# of those adapter names ever shows up in cost_events, it needs a row here and
# a line in this list. (`vllm` WAS on this line until 2026-10-17: strata-rag
# now emits it for its chat calls — it is listed below.) Also absent: `local` (a catalog KEY, never a billing
# provider — `billing_provider_for` maps it to pgx-local / deepseek /
# inference_router).
required_providers:
  # BYO + routed LLM providers
  - anthropic        # worker_management BYO emitter (catalog key `anthropic`)
  - claude           # inference-router catalog provider name
  - cohere
  - deepseek
  - google           # catalog key `google-gemini` -> provider `google`
  - groq
  - inference_router # _BILLING_PROVIDER_OVERRIDES fallthrough (see block below)
  - openai
  - pgx-local
  - xai
  # Self-hosted inference
  - gemma
  - mlx_inference
  # w2v media / modality
  - deepgram
  - elevenlabs
  - html-render     # w2v html/web-design render emitter (service_key w2v-html-render)
  - kitten
  - kokoro
  - mflux
  - mlx-whisper
  - video-analyzer
  - video-compiler
  # MLX embedding / rerank / ingestion vision / NLP / attention
  - mlx-attention   # mlx_backend /attention emitter (served_model "scaled-dot-product")
  - mlx-clip
  - mlx-embed
  - mlx-nlp
  - mlx-ocr
  - mlx-rerank
  # strata (strata_rag / strata_ingest) self-hosted providers
  - mlx-api         # strata-ingest: any mlx-api* host (ocr / transcribe / vision)
  - mlx-api-text    # strata-rag: mlx_api text host (embed / rerank)
  - vllm            # strata-rag: api.nonagentic.ai/vllm (chat)
  # KAG ingestion pipeline
  - hirag
  - kag               # kag_graph_service retrieval/query stage (emits an EMPTY served_model)
  - kag-graph
  - karma
  - webscraper

rows:
  # --- Anthropic (provider key = "claude") ---
  # Source: https://platform.claude.com/docs/en/about-claude/pricing
  # Verified 2026-04-26.
  #
  # The provider KEY here is "claude" — matching what inference-router emits
  # on cost events (catalog name, see gitops-production providers-configmap:
  # `name: claude`). The original seed used "anthropic" which never matched
  # the live cost_event stream → all claude rows had cost_usd=NULL until
  # 2026-05-09 when this was renamed. Existing "anthropic" rows in the live
  # DB are dead data; they don't get hit by pricing lookups but stay around
  # as audit history.
  - provider: claude
    model: claude-sonnet-4-20250514
    cost_model: per_token
    input_per_1m_usd: "3.00"
    output_per_1m_usd: "15.00"
    cache_creation_per_1m_usd: "3.75"   # 5-minute cache write, 1.25x input
    cache_read_per_1m_usd: "0.30"        # 0.10x input
    notes: >-
      Anthropic API pricing 2026-04-26 (claude.com/pricing). 5m cache write
      rate; 1h variant ($6/MTok) not modeled — most cache writes use 5m
      default.

  # Claude 4.x family — short model IDs as emitted by inference-router /
  # claude-api skill. Verified 2026-05-08 against Anthropic's public rates.
  # Cache-write rate modeled = 5-minute (1.25x input). 1-hour cache write
  # (1.5625x input) is not currently emitted by inference-router as a
  # separate token class so we don't model it here; if we ever start tracking
  # cache_creation_5m vs cache_creation_1h separately, add a column or a
  # second row variant.
  - provider: claude
    model: claude-opus-4-7
    cost_model: per_token
    input_per_1m_usd: "15.00"
    output_per_1m_usd: "75.00"
    cache_creation_per_1m_usd: "18.75"   # 5m cache write, 1.25x input
    cache_read_per_1m_usd: "1.50"         # 0.10x input
    notes: >-
      Anthropic claude-opus-4-7 (verified 2026-05-08). 1h cache write rate
      ($23.4375/MTok) not modeled — see anthropic comment block above.

  - provider: claude
    model: claude-sonnet-4-6
    cost_model: per_token
    input_per_1m_usd: "3.00"
    output_per_1m_usd: "15.00"
    cache_creation_per_1m_usd: "3.75"
    cache_read_per_1m_usd: "0.30"
    notes: >-
      Anthropic claude-sonnet-4-6 (verified 2026-05-08). Same rates as
      claude-sonnet-4-20250514; the short ID is what inference-router emits
      for the 4.6 family.

  - provider: claude
    model: claude-haiku-4-5
    cost_model: per_token
    input_per_1m_usd: "0.80"
    output_per_1m_usd: "4.00"
    cache_creation_per_1m_usd: "1.00"     # 5m cache write, 1.25x input
    cache_read_per_1m_usd: "0.08"         # 0.10x input
    notes: >-
      Anthropic claude-haiku-4-5 (verified 2026-05-08). 1h cache write rate
      ($1.25/MTok) not modeled — see anthropic comment block above.

  - provider: claude
    model: claude-haiku-4-5-20251001
    cost_model: per_token
    input_per_1m_usd: "0.80"
    output_per_1m_usd: "4.00"
    cache_creation_per_1m_usd: "1.00"     # 5m cache write, 1.25x input
    cache_read_per_1m_usd: "0.08"         # 0.10x input
    notes: >-
      claude-haiku-4-5-20251001 — the dated snapshot alias of claude-haiku-4-5;
      identical published rates. Without this per-model row the dated id falls
      through to the claude provider-default (Opus $15/$75) and OVER-bills ~18x.
      Latent today (0 haiku events in 90d, verified 2026-07-23); added as a
      guardrail alongside tests/test_pricing_drift.py.

  # Provider-default fallback row for claude. Used when a request lands on a
  # model that doesn't have its own (provider, model) row yet — keeps cost_usd
  # from going NULL on unknown Claude variants until per-model rows are added.
  #
  # THE CEILING RULE (enforced by tests/test_pricing_ceiling.py): a
  # provider-default MUST be at least as expensive as EVERY per-model row of
  # that provider. Here that means Opus 4.7 rates ($15/$75), not Sonnet's
  # $3/$15.
  # WHY the ceiling and not the "most common" rate: the two errors are not
  # symmetric. OVER-billing an unseeded model id is self-correcting — the
  # moment we seed that id with its real rate, the per-model row overrides and
  # the overcharge stops (and any over-collected amount is visible and
  # refundable). UNDER-billing is unrecoverable: the revenue was never
  # measured, there is nothing to reconcile against, and nothing surfaces the
  # loss. Until 2026-07-20 this row sat at Sonnet rates, so every unseeded
  # Anthropic id (claude-opus-4-8, claude-fable-5) billed at 1/5 of Opus.
  - provider: claude
    model: null
    cost_model: per_token
    input_per_1m_usd: "15.00"
    output_per_1m_usd: "75.00"
    cache_creation_per_1m_usd: "18.75"
    cache_read_per_1m_usd: "1.50"
    notes: >-
      claude provider-default = Opus 4.7 rates ($15/$75) — the priciest seeded
      Claude model, per the provider-default ceiling rule (a default must be >=
      every per-model row; over-billing an unseeded id self-corrects when it is
      seeded, under-billing is unrecoverable). Per-model rows for Opus 4.7 /
      Sonnet 4.6 / Haiku 4.5 override; this row catches anything else (e.g. an
      unknown future Claude variant inference-router starts emitting before we
      seed it). Raised from Sonnet's $3/$15 on 2026-07-20 — must be accompanied
      by a superseding POST /api/config/provider-pricing row in prod or the
      seeder reports DIVERGED.

  # --- Anthropic (provider key = "anthropic") ---
  #
  # ⚠️ DO NOT "DEDUPLICATE" THIS BLOCK AGAINST THE `claude` BLOCK ABOVE.
  # `claude` AND `anthropic` ARE BOTH LIVE PROVIDER KEYS AND BOTH ARE REQUIRED.
  #
  #   * `claude`    — what inference-router emits (its provider `name: claude`
  #                   in the gitops providers-configmap).
  #   * `anthropic` — what worker_management's BYO emitter sends: the
  #                   provider_catalog preset key `anthropic` has no entry in
  #                   `_BILLING_PROVIDER_OVERRIDES`, so `billing_provider_for`
  #                   returns the preset's own provider, "anthropic", unchanged
  #                   (worker_management/src/worker/agents/provider_catalog.py).
  #
  # History: the 2026-05-09 rename of these rows from "anthropic" to "claude"
  # fixed the ROUTER traffic and left the BYO traffic uncovered — every BYO
  # Anthropic event went to cost_usd=NULL. The comment above claiming the
  # leftover "anthropic" rows are "dead data" was true on 2026-05-09 and is
  # false now. Equivalent rows were later added straight to the live DB but
  # never back-ported here, so the seed file drifted: rebuilding a deployment
  # from this seed alone would silently drop Anthropic BYO pricing again.
  # Transcribed verbatim from the live open (effective_until IS NULL) rows.
  - provider: anthropic
    model: claude-sonnet-4-20250514
    cost_model: per_token
    input_per_1m_usd: "3.00"
    output_per_1m_usd: "15.00"
    cache_creation_per_1m_usd: "3.75"   # 5-minute cache write, 1.25x input
    cache_read_per_1m_usd: "0.30"        # 0.10x input
    notes: >-
      Anthropic API pricing 2026-04-26 (claude.com/pricing). 5m cache write
      rate; 1h variant ($6/MTok) not modeled — most cache writes use 5m
      default.

  - provider: anthropic
    model: claude-sonnet-4-6
    cost_model: per_token
    input_per_1m_usd: "3.00"
    output_per_1m_usd: "15.00"
    cache_creation_per_1m_usd: "3.75"
    cache_read_per_1m_usd: "0.30"
    notes: >-
      Anthropic claude-sonnet-4-6 (verified 2026-05-08). Same rates as
      claude-sonnet-4-20250514; short ID emitted by inference-router for the
      4.6 family.

  - provider: anthropic
    model: claude-opus-4-7
    cost_model: per_token
    input_per_1m_usd: "15.00"
    output_per_1m_usd: "75.00"
    cache_creation_per_1m_usd: "18.75"   # 5m cache write, 1.25x input
    cache_read_per_1m_usd: "1.50"         # 0.10x input
    notes: >-
      Anthropic claude-opus-4-7 (verified 2026-05-08). 5m cache write rate; 1h
      variant ($23.4375/MTok) not modeled.

  - provider: anthropic
    model: claude-haiku-4-5
    cost_model: per_token
    input_per_1m_usd: "0.80"
    output_per_1m_usd: "4.00"
    cache_creation_per_1m_usd: "1.00"     # 5m cache write, 1.25x input
    cache_read_per_1m_usd: "0.08"         # 0.10x input
    notes: >-
      Anthropic claude-haiku-4-5 (verified 2026-05-08). 5m cache write rate; 1h
      variant ($1.25/MTok) not modeled.

  - provider: anthropic
    model: claude-haiku-4-5-20251001
    cost_model: per_token
    input_per_1m_usd: "0.80"
    output_per_1m_usd: "4.00"
    cache_creation_per_1m_usd: "1.00"     # 5m cache write, 1.25x input
    cache_read_per_1m_usd: "0.08"         # 0.10x input
    notes: >-
      claude-haiku-4-5-20251001 dated snapshot of claude-haiku-4-5, BYO (anthropic)
      side — same rates as the claude-side row. Without it the dated id falls
      through to the anthropic provider-default (Opus $15/$75) and OVER-bills ~18x.

  # Provider-default for anthropic. The BYO catalog also offers claude-opus-4-8
  # and claude-fable-5, which have no per-model row anywhere — this row is what
  # keeps them from pricing NULL.
  #
  # THE CEILING RULE (enforced by tests/test_pricing_ceiling.py): a
  # provider-default MUST be >= EVERY per-model row of that provider on every
  # rate axis, so it is Opus 4.7 rates ($15/$75), not Sonnet's $3/$15.
  # WHY: over-billing an unseeded model id is SELF-CORRECTING — seed the id
  # with its real rate and the per-model row takes over; the overcharge is
  # visible in the data and refundable. Under-billing is UNRECOVERABLE — the
  # revenue was never measured, no row records what should have been charged,
  # and nothing raises. Until 2026-07-20 this row was at Sonnet rates, so the
  # unseeded claude-opus-4-8 / claude-fable-5 the BYO catalog offers billed at
  # 1/5 of Opus, silently.
  - provider: anthropic
    model: null
    cost_model: per_token
    input_per_1m_usd: "15.00"
    output_per_1m_usd: "75.00"
    cache_creation_per_1m_usd: "18.75"
    cache_read_per_1m_usd: "1.50"
    notes: >-
      anthropic provider-default = Opus 4.7 rates ($15/$75), the priciest
      seeded Anthropic model, per the provider-default ceiling rule. Raised
      2026-07-20 from the previously-transcribed live $3/$15, which under-stated
      an unseeded Anthropic id by 5x (claude-opus-4-8, claude-fable-5 are in the
      BYO catalog with no per-model row). The `claude` block above carries the
      identical change. THIS EDIT MUST SHIP WITH a superseding POST
      /api/config/provider-pricing row for both (anthropic, NULL) and
      (claude, NULL) in prod: the seeder is insert-if-absent and reports
      DIVERGED (exit 1, failing the pricing-seed CronJob) when a seeded rate
      differs from the live one, so a seed-only edit turns the Job red.

  # --- DeepSeek ---
  # Source: https://api-docs.deepseek.com/quick_start/pricing
  # Verified 2026-04-26.
  - provider: deepseek
    model: deepseek-chat
    cost_model: per_token
    input_per_1m_usd: "0.14"
    output_per_1m_usd: "0.28"
    # cache_*: leave NULL — DeepSeek's context-cache uses a different model
    # from Anthropic's prompt cache (cache hit is $0.028, but inference-router
    # doesn't currently distinguish cache_hit_tokens on the wire).
    notes: >-
      DeepSeek API pricing 2026-04-26 (api-docs.deepseek.com). deepseek-chat
      = non-thinking mode of deepseek-v4-flash. Cache-hit ($0.028) not
      modeled until inference-router emits cache_hit_tokens.
      DEPRECATED BY DEEPSEEK 2026-07-24 15:59 UTC, together with
      deepseek-reasoner; deepseek-v4-flash / deepseek-v4-pro replace them.
      THE ROW IS RETAINED ON PURPOSE — do NOT delete it. Historic cost_events
      still reference model="deepseek-chat", and provider_pricing is looked up
      by (provider, model) at the event's timestamp: removing the row would
      make every past deepseek-chat event unpriceable on any re-cost /
      reprice run.

  # deepseek-v4-flash / deepseek-v4-pro are the ids DeepSeek actually serves
  # today (GET https://api.deepseek.com/v1/models, verified 2026-07-19 — the
  # same verification recorded in provider_catalog.py). `deepseek-chat` /
  # `deepseek-reasoner` are DEPRECATED 2026-07-24. Both the BYO `deepseek`
  # preset and the router's tier-medium/tier-flash aliases send these ids, so
  # without their own rows they fell back to the deepseek-chat-rate default and
  # UNDER-billed v4-pro by ~3x. Rates from api-docs.deepseek.com/quick_start/
  # pricing, verified 2026-07-19. `input_per_1m_usd` is the cache-MISS rate;
  # `cache_read_per_1m_usd` now carries DeepSeek's published cache-HIT input
  # rate, so the rate is on record even while inference-router does not yet emit
  # cache_hit_tokens (services/pricing.py falls back to the input rate when the
  # column is NULL — seeding it means the hit rate applies the moment the
  # emitter starts sending the token class).
  - provider: deepseek
    model: deepseek-v4-pro
    cost_model: per_token
    input_per_1m_usd: "0.435"
    output_per_1m_usd: "0.87"
    cache_read_per_1m_usd: "0.003625"   # DeepSeek published cache-HIT input rate
    notes: >-
      DeepSeek deepseek-v4-pro. input_per_1m_usd is the cache-MISS input rate;
      cache_read_per_1m_usd ($0.003625/MTok) is DeepSeek's published cache-HIT
      input rate (api-docs.deepseek.com/quick_start/pricing, verified
      2026-07-19). The hit rate only takes effect once the emitter sends
      cache_hit_tokens; until then every input token bills at the miss rate.

  - provider: deepseek
    model: deepseek-v4-flash
    cost_model: per_token
    input_per_1m_usd: "0.14"
    output_per_1m_usd: "0.28"
    cache_read_per_1m_usd: "0.0028"     # DeepSeek published cache-HIT input rate
    notes: >-
      DeepSeek deepseek-v4-flash. input_per_1m_usd is the cache-MISS input rate;
      cache_read_per_1m_usd ($0.0028/MTok) is DeepSeek's published cache-HIT
      input rate (verified 2026-07-19). Same miss rates as the deprecated
      deepseek-chat/-reasoner ids, which are its non-thinking / thinking modes.
      The hit rate only takes effect once the emitter sends cache_hit_tokens.

  # Provider-default fallback for deepseek = deepseek-v4-pro rates: the most
  # expensive seeded DeepSeek model, so an unseeded id is never silently
  # UNDER-billed (same convention as the xai provider-default below).
  - provider: deepseek
    model: null
    cost_model: per_token
    input_per_1m_usd: "0.435"
    output_per_1m_usd: "0.87"
    notes: >-
      deepseek provider-default = deepseek-v4-pro rates (the priciest seeded
      DeepSeek model — an unseeded id must never be under-billed). Per-model
      rows above override. Reached today by the BYO `deepseek` preset and by the
      router's tier-medium alias, which bills under deepseek via
      _BILLING_PROVIDER_OVERRIDES.

  # --- vLLM (gemma) — self-hosted on hp1 ---
  - provider: gemma
    model: null
    cost_model: self_hosted_amortized
    monthly_fixed_cost_usd: 45.00
    notes: >-
      vLLM serving gemma-4-e2b-it-rotorquant-awq-8bit on hp1 (RTX 5060). LoRA
      adapters per schema_id. cost_usd recomputes to $0 per event; the amortized
      monthly fixed cost ($45 — operator-set electricity + GPU lifetime) is
      seeded here so the seed matches the live effective row (was null → seed
      diverged from prod, which already carries 45.00).

  # --- mlx_inference — self-hosted on Mac mini ---
  - provider: mlx_inference
    model: null
    cost_model: self_hosted_amortized
    monthly_fixed_cost_usd: 20.00
    notes: >-
      MLX-Apple inference now served by inference-router on PGX
      (inference-router.inference-router.svc.cluster.local:8150).
      Models: Qwen3-4B-AWQ, mlx-community/Qwen3-1.7B-8bit. Returns $0 per
      event; the amortized monthly fixed cost ($20 — operator-set) is seeded
      here so the seed matches the live effective row (was null → seed diverged
      from prod, which already carries 20.00).

  # --- pgx-local — self-hosted local LLM on the DGX (pgx) ---
  # Emitted key: provider="pgx-local", served_model="local-llm" (verified live
  # in prod cost_events 2026-06-19). Unlike the other self-hosted providers
  # (gemma/mlx_inference → self_hosted_amortized = $0/event), George assigns an
  # explicit per-token internal cost to local inference so it bills with real
  # numbers (markup applies on top per the markup engine). Keyed to the emitted
  # served_model "local-llm" so the pricing resolver matches it on rung 1.
  - provider: pgx-local
    model: local-llm
    cost_model: per_token
    input_per_1m_usd: "10.00"
    output_per_1m_usd: "25.00"
    notes: >-
      pgx-local local LLM on the DGX. Internal cost rate set by George
      2026-06-19: $10 / 1M input, $25 / 1M output. Keyed to the emitted
      served_model "local-llm".

  # Provider-default for pgx-local. `_BILLING_PROVIDER_OVERRIDES` maps BOTH
  # `local-llm` AND `default` (the generic fallback chain) to provider
  # "pgx-local", and the model on the box is swapped without touching the
  # catalog (the vllm.service unit is model-agnostic), so any served_model
  # other than the literal "local-llm" would price NULL without this row.
  - provider: pgx-local
    model: null
    cost_model: per_token
    input_per_1m_usd: "10.00"
    output_per_1m_usd: "25.00"
    notes: >-
      pgx-local provider-default = the same $10/$25 internal rate as the
      local-llm row (the only pgx-local rate George has set, 2026-06-19), so the
      `default` alias and any future served_model the DGX vLLM reports still
      price. Per-model rows override.

  # --- w2v local media models — self-hosted on Apple Silicon (m1/m4/mini2) ---
  # These media services report non-LLM units in input_tokens (TTS = characters,
  # image-gen = megapixels) and output_tokens = 0. The cost_flusher treats the
  # emitter's cost_usd as a hint and recomputes the authoritative cost from
  # these rows (services/cost_flusher.py). All are model=null provider-defaults
  # so they match whatever served_model the local model emits (e.g. kokoro's
  # served_model is a volatile ".../kokoro-v1.0.onnx" file path). Rates set by
