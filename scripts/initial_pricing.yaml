  # kag — kag_graph_service RETRIEVAL/query stage. A DIFFERENT provider string from
  # `kag-graph` (the graph BUILD above) and, until 2026-09-04, entirely unseeded: 4
  # live events priced NULL. The emitter sends input_tokens=0 / output_tokens=0 and
  # carries its unit in usage_extra.survivor_count, so any per-token rate prices
  # every event at exactly $0 — per_request is the only family that can charge at
  # all, matching the rest of this block.
  #
  # RATE IS PROVISIONAL — no independent market comparable was benchmarked for a
  # retrieval call, so this mirrors its closest sibling (kag-graph, $0.01153846 =
  # $0.015 market ÷ 1.3) rather than inventing a number. Mirroring UP rather than
  # guessing DOWN is deliberate and follows the ceiling rule this repo already
  # states for provider-defaults (see test_claude_provider_default): over-billing an
  # unseeded unit self-corrects the moment a real rate is seeded, under-billing is
  # unrecoverable because the revenue was never measured and nothing raises.
  # Recalibrate from real volume once the billable unit for a retrieval is agreed.
  - provider: kag
    model: null
