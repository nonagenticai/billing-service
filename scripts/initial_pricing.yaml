    cost_model: per_character
    input_per_1m_usd: "15.00"
    output_per_1m_usd: "0"
    notes: >-
      OpenAI tts-1 (w2v-tts BYO). input_tokens = characters → $15 / 1M chars
      (openai.com/api/pricing, 2026-07-09). Cost basis; markup/platform-fee on top.
  - provider: openai
