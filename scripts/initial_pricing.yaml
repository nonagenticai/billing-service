  # and silently NULL every unseeded event (see
  # tests/test_pricing_coverage.py::test_mixed_family_provider_refuses_default_as_a_loud_miss).
  - provider: mlx-attention
    model: null
    cost_model: per_request
    per_request_usd: "0.001"
    notes: >-
      mlx-backend parameter-free scaled-dot-product cross-attention
      (served_model "scaled-dot-product"), self-hosted on Apple Silicon
      (mini1:9101). One cost_event per /attention call;
      usage_extra.unit="attention_keys" with quantity = the number of key
