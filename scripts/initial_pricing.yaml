      audio out); emit unit is characters. ~$12 / 1M chars char-based ESTIMATE,
      2026-07-09. Cost basis; retune when a firm per-char figure is known.

  # TTS — ElevenLabs (characters). Multilingual $0.10/1k char, Turbo/Flash $0.05/1k.
