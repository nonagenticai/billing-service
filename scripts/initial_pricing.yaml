  # mlx-attention — parameter-free scaled-dot-product cross-attention
  # (`mlx_backend` `src/routers/ml_routes.py` `/attention`), self-hosted on
  # Apple Silicon (mini1:9101). ADDED 2026-09-17: mlx_backend#49 merged
  # 04:08Z and went live on mini1 at 04:13Z, so this provider is EMITTING NOW
  # and was never seeded — every event it produces prices NULL, fires
  # MeteringPricingMiss and is skipped by billing.generate_billing(). Adding a
  # never-seeded provider is the seed script's "absent -> POST it" branch, NOT
  # a rate change to an already-seeded row (which the file header forbids).
  # Same branch the mlx-nlp row above was added under on 2026-09-04.
  #
  # Unit: attention_keys. `ml_routes.py:176-186` sends
  # quantity=int(keys.shape[0]) with usage_extra.unit="attention_keys", i.e.
  # the MEASURED number of key vectors scored, plus `dim` alongside it.
  # ⚠️ But it is NOT stored: `attention_keys` is absent from
  # `cost_flusher.py:77 QUANTITY_UNITS` {tokens, characters, seconds,
  # megapixels, passages, requests}, so `_parse_bounded_str` (:113-124) drops
  # it silently and the persisted `quantity_unit` becomes "requests" via
  # QUANTITY_UNIT_BY_COST_MODEL. Harmless for the charge (per_request ignores
  # the unit entirely) but the emitted unit is lost — do not read
  # billing_metering_events.quantity_unit as evidence of what was measured.
  #
  # model: null — and here that is not merely future-proofing. The emitter
  # sends the literal served_model "scaled-dot-product", which names the
  # ALGORITHM, not a checkpoint: the op is parameter-free (softmax over
  # scaled query·keyᵀ), so there is no model to version. A provider-default
  # row catches that literal on rung 4 of `_resolve_pricing_row` and also
  # catches any future kernel rename without a second seed.
  #
  # Rate: $0.001 per request, adopted from the sibling mlx-* per_request rows
  # rather than derived from a market comparable. Derivation: the two MLX rows
  # whose quantity is likewise a COUNT of scored items — mlx-rerank
  # (#passages) and mlx-clip (#items) — are both $0.001/call at George's
  # 2026-06-22 bundle rates, and attention is strictly cheaper work than
  # either (one parameter-free softmax versus a bge-reranker-v2-m3 cross-
  # encoder forward pass), so $0.001 is an upper bound on a like-for-like
  # basis and no external benchmark can tighten it. Per the mlx-* convention
  # this is seeded AT the number (the KAG block's market÷1.3 markup
  # convention deliberately does NOT apply here).
  #
  # cost_model: per_request, matching mlx-rerank/mlx-clip/mlx-ocr: one
  # cost_event per /attention call, charged as a flat per-call fee. This keeps
  # mlx-attention SINGLE-FAMILY — adding a per_token or per_character row here
