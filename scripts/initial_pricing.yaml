      pgx-local/local-llm internal rate ($10/$25, George 2026-06-19). Present
      because live cost_events with provider='inference_router',
      model='local-llm' and cost_usd IS NULL exist (verified 2026-07-19) — the
      override to pgx-local is not applied on every emit path.
      CAVEAT: `local-llm` is an AMBIGUOUS alias — providers-configmap.yaml maps
      it under pgx-local (-> local-llm) AND under deepseek (-> v4-flash), so
      _auto_pin_by_alias refuses to pin it and the request falls through
      default_chain. That chain's primary is pgx-local, so $10/$25 is right for
      the normal case; while pgx-local is DEGRADED the request fails over to
      deepseek-v4-flash ($0.14/$0.28) and this row then OVER-states cost by
      ~70x. Low volume today (2 events ever). The real fix is upstream —
      disambiguate the alias in the router config — not a rate tweak here.

  - provider: inference_router
    model: default
    cost_model: per_token
    input_per_1m_usd: "10.00"
    output_per_1m_usd: "25.00"
    notes: >-
      Router `default` chain [pgx-local, deepseek] — priced at the pgx-local
      internal rate ($10/$25), the more expensive of the two chain members, so a
      default-chain request is never under-billed regardless of which provider
      actually served it.

  # Provider-default for inference_router. Deliberately NOT the cheapest
  # backing model: an unmapped alias could route anywhere in the chain, so this
  # takes grok-4.5 (tier-high, the priciest EXTERNAL model the router fronts) as
  # the floor. It is a safety net against _BILLING_PROVIDER_OVERRIDES
  # fallthrough, not a description of a real vendor's price list — if this row
  # starts matching material volume, that is a signal to add the missing
  # override in worker_management rather than to tune this rate.
  - provider: inference_router
    model: null
    cost_model: per_token
    input_per_1m_usd: "10.00"
    output_per_1m_usd: "25.00"
    notes: >-
      inference_router provider-default = pgx-local rates ($10/$25), the
      priciest rate seeded for ANY model this router fronts. Deliberately not
      grok-4.5's $2/$6: the convention for a provider-default is the priciest
      seeded row, so an unseeded id can never be silently UNDER-billed, and
      pgx-local is 5x above grok-4.5 here. (An earlier draft of this row used
      grok-4.5 on the reasoning that it is the priciest *external* model — but
      the router's primary in default_chain is pgx-local, so external-only is
      the wrong frame.) NOT a vendor price list — this row exists solely to
      catch models that fall through _BILLING_PROVIDER_OVERRIDES in
      worker_management's provider_catalog and would otherwise write
      cost_usd=NULL (2 such live events, 2026-07-19). Per-model alias rows
      above override. Volume matching THIS row means an override is missing
      upstream — fix it there, do not tune this rate.


  # --- External-cloud MODALITY providers (managed-BYO / owner_provided) ---
  # These are the real provider COST basis for the modality-gateway BYO paths
  # (tts / asr / image / embedding). When a tenant is owner_provided (platform
  # supplies the key), billing marks up this cost; when byo (tenant supplies the
  # key), the byo platform fee applies (markup forced to 0). Without these rows an
  # owner_provided modality line degrades to surcharge-only (EMIT_COVERAGE.md #4).
  #
  # Provider + model strings are the worker_management modality_catalog presets
  # (provider doubles as the billing key). Units match what the gateway emits:
  #   tts       → input_tokens = characters   (per_token, output 0)
  #   asr       → input_tokens = round(seconds) (per_token, output 0)
  #   embedding → input_tokens = characters   (per_token; upstream is per-token,
  #               so the per-1M-char rate = per-1M-token ÷ ~4 chars/token)
  #   image     → one event per image, quantity=1 (per_request)
  # Vendor rates verified 2026-07-09 (OpenAI/ElevenLabs/Deepgram pricing pages).

